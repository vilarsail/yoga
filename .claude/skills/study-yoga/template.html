<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<style>
:root{
  --ink:#2b2620;
  --ink-soft:#5c5348;
  --paper:#f7f3ec;
  --card:#fffdf8;
  --accent:#9a3b2e;      /* 朱红 */
  --accent-soft:#f3e2dd;
  --blue:#2e4a62;        /* 藏青 */
  --blue-soft:#e2eaf1;
  --gold:#8a6d1f;
  --gold-soft:#f4ecd4;
  --green:#3d6b4f;
  --green-soft:#e0eee5;
  --line:#e4dccc;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  background:var(--paper);color:var(--ink);line-height:1.85;
}
a{color:var(--blue)}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 120px}

/* ===== 顶部 ===== */
header.hero{
  background:linear-gradient(135deg,#2e4a62 0%,#3d5f7d 60%,#5a4632 100%);
  color:#f5efe2;text-align:center;padding:64px 20px 56px;
}
header.hero .kicker{letter-spacing:.35em;font-size:.85rem;opacity:.75;margin-bottom:14px}
header.hero h1{font-size:2rem;font-weight:600;letter-spacing:.08em;margin-bottom:14px}
header.hero p.sub{max-width:640px;margin:0 auto;opacity:.88;font-size:1.02rem}
header.hero .tagline{
  display:inline-block;margin-top:26px;padding:10px 26px;border:1px solid rgba(245,239,226,.4);
  border-radius:999px;font-size:.95rem;letter-spacing:.12em;
}

/* ===== 导航 ===== */
nav.toc{
  position:sticky;top:0;z-index:50;background:rgba(247,243,236,.96);
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);
  overflow-x:auto;white-space:nowrap;padding:10px 12px;
}
nav.toc a{
  display:inline-block;padding:4px 12px;margin:0 3px;border-radius:999px;
  font-size:.86rem;color:var(--ink-soft);text-decoration:none;
}
nav.toc a:hover{background:var(--accent-soft);color:var(--accent)}
nav.toc a.done{color:var(--green)}

/* ===== 学习路径 ===== */
.path-box{
  margin:34px 0 10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px 26px;
}
.path-box h2{font-size:1.15rem;margin-bottom:6px;color:var(--blue)}
.path-box p.hint{font-size:.88rem;color:var(--ink-soft);margin-bottom:14px}
.step-item{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.step-item:first-of-type{border-top:none}
.step-item label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;flex:1}
.step-item input{margin-top:8px;accent-color:var(--green);width:17px;height:17px;flex-shrink:0}
.step-item .no{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);
  color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:4px;
}
.step-item.completed .no{background:var(--green);color:#fff}
.step-item .txt b{font-size:1rem}
.step-item .txt span{display:block;font-size:.87rem;color:var(--ink-soft)}
.progress-bar{height:8px;background:var(--blue-soft);border-radius:99px;overflow:hidden;margin-top:14px}
.progress-bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--green),#6fa585);transition:width .4s}
.progress-text{font-size:.82rem;color:var(--ink-soft);text-align:right;margin-top:4px}

/* ===== 章节 ===== */
section.chapter{margin-top:64px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.sec-head .num{
  font-size:2.4rem;font-weight:700;color:var(--accent);opacity:.25;line-height:1;
}
.sec-head h2{font-size:1.5rem;color:var(--ink)}
.sec-lead{color:var(--ink-soft);font-size:.98rem;margin-bottom:22px;max-width:720px}
.divider{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-top:18px}

/* ===== 卡片 ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:18px;
}
.card h3{font-size:1.08rem;color:var(--blue);margin-bottom:10px}
.card .quote{
  background:var(--blue-soft);border-left:3px solid var(--blue);
  padding:10px 16px;border-radius:0 10px 10px 0;font-size:.9rem;color:var(--blue);
  margin:10px 0;
}
.card .quote .src{display:block;text-align:right;font-size:.78rem;opacity:.65;margin-top:4px}
.analogy{
  background:var(--gold-soft);border-left:3px solid var(--gold);
  padding:10px 16px;border-radius:0 10px 10px 0;font-size:.93rem;margin:10px 0;
}
.analogy b{color:var(--gold)}
.plain{background:var(--green-soft);border-left:3px solid var(--green);
  padding:10px 16px;border-radius:0 10px 10px 0;font-size:.95rem;margin:10px 0}
.plain::before{content:"一句话 ";font-weight:700;color:var(--green);font-size:.82rem;letter-spacing:.1em}
.case{
  background:var(--accent-soft);border:1px dashed var(--accent);
  padding:10px 16px;border-radius:10px;font-size:.93rem;margin:10px 0;
}
.case::before{content:"案例 · ";font-weight:700;color:var(--accent);font-size:.82rem;letter-spacing:.1em}

/* 翻转卡片 */
.fn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.fn-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
}
.fn-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(60,50,30,.1)}
.fn-card .front .cn{font-size:1.15rem;font-weight:700;color:var(--accent)}
.fn-card .front .sub{font-size:.85rem;color:var(--ink-soft);margin-top:2px}
.fn-card .front .tap{position:absolute;right:16px;bottom:12px;font-size:.75rem;color:#b7ab98}
.fn-card.open{background:var(--blue-soft);border-color:var(--blue)}
.fn-card .back{display:none;font-size:.9rem;margin-top:12px;border-top:1px dashed var(--blue);padding-top:12px}
.fn-card.open .back{display:block}
.fn-card .back em{display:block;color:var(--blue);font-size:.85rem;margin-top:8px}

/* 演示区 */
.demo-area{text-align:center;padding:10px 0}

/* 流程推演 */
.flow-track{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px;justify-content:center}
.flow-node{
  padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);
  font-size:.9rem;color:var(--ink-soft);transition:all .25s;cursor:pointer;
}
.flow-node.active{background:var(--accent);border-color:var(--accent);color:#fff}
.flow-node.past{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.flow-detail{
  min-height:96px;background:var(--card);border:1px dashed var(--accent);
  border-radius:var(--radius);padding:18px 22px;font-size:.97rem;
}
.flow-detail b{color:var(--accent)}
.flow-ctrl{text-align:center;margin-top:12px}

/* 条件模拟器 */
.cond-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 6px;border-top:1px dashed var(--line)}
.cond-row:first-of-type{border-top:none}
.cond-row .name{font-weight:700}
.cond-row .name small{display:block;font-weight:400;color:var(--ink-soft);font-size:.84rem}
.switch{position:relative;width:52px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfc4b2;border-radius:99px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider::before{transform:translateX(24px)}
#condResult{
  margin-top:16px;padding:16px 20px;border-radius:var(--radius);
  background:var(--blue-soft);color:var(--blue);font-size:.98rem;
}
#condResult.fail{background:var(--accent-soft);color:var(--accent)}
.obstacle-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.obstacle-tags span{font-size:.83rem;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:3px 12px;color:var(--ink-soft)}

/* 时间轴 */
.timeline{position:relative;margin:22px 0 6px;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:6px 0 20px}
.tl-item::before{content:"";position:absolute;left:-25px;top:14px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:3px solid var(--accent)}
.tl-item .t{font-weight:700;color:var(--accent)}
.tl-item .d{font-size:.92rem;color:var(--ink-soft)}

/* 对比卡片 */
.yuan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.yuan-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.yuan-card h4{color:var(--blue);font-size:1.02rem;margin-bottom:6px}
.yuan-card .y-tag{display:inline-block;font-size:.75rem;background:var(--blue-soft);color:var(--blue);
  border-radius:99px;padding:2px 10px;margin-bottom:8px}
.yuan-card p{font-size:.9rem;color:var(--ink-soft)}
.yuan-card p b{color:var(--ink)}

/* 归类练习 */
.tri-row{display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 6px;border-top:1px dashed var(--line);flex-wrap:wrap}
.tri-row:first-of-type{border-top:none}
.tri-row .acts{display:flex;gap:8px}
.tri-btn{font-family:inherit;font-size:.85rem;padding:5px 16px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .15s}
.tri-btn.correct{background:var(--green);border-color:var(--green);color:#fff}
.tri-btn.wrong{background:var(--accent);border-color:var(--accent);color:#fff}
.tri-exp{width:100%;font-size:.86rem;color:var(--green);display:none;padding-top:4px}
.tri-exp.show{display:block}

/* 字典区 */
details.dict{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  margin-bottom:10px;overflow:hidden}
details.dict summary{cursor:pointer;padding:15px 20px;font-weight:700;color:var(--blue);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details.dict summary::after{content:"展开 ▾";font-size:.8rem;color:var(--ink-soft);font-weight:400}
details.dict[open] summary::after{content:"收起 ▴"}
details.dict summary .hint{font-size:.8rem;font-weight:400;color:var(--ink-soft);margin-left:10px}
details.dict .body{padding:0 20px 18px;font-size:.92rem;color:var(--ink-soft)}
details.dict .body p{margin-bottom:8px}
details.dict .body p b{color:var(--ink)}

/* 词源卡 */
.ety-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ety{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.ety .zi{font-size:1.9rem;font-weight:700;color:var(--accent);line-height:1}
.ety .gc{font-size:.85rem;color:var(--ink-soft);margin:8px 0;font-style:italic}
.ety .bhu{font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

/* 表格 */
.table-wrap{overflow-x:auto}
table.nine{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);
  border-radius:var(--radius);overflow:hidden}
table.nine th,table.nine td{border:1px solid var(--line);padding:10px 14px;text-align:left}
table.nine th{background:var(--blue);color:#fff;font-weight:600}
table.nine td:nth-child(2){color:var(--accent);font-weight:600;white-space:nowrap}

/* 偈颂 */
.gatha{
  text-align:center;background:linear-gradient(135deg,#2e4a62,#5a4632);
  color:#f5efe2;border-radius:var(--radius);padding:34px 20px;margin:26px 0;
}
.gatha .lines{font-size:1.15rem;letter-spacing:.2em;line-height:2.4}
.gatha .mean{margin-top:16px;font-size:.9rem;opacity:.8;letter-spacing:.05em}

footer{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:.84rem}
@media (max-width:640px){
  .sec-head .num{font-size:1.8rem}
  header.hero h1{font-size:1.5rem}
}
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{HERO_TITLE}}</h1>
  <p class="sub">{{HERO_SUB}}</p>
  <div class="tagline">{{HERO_TAGLINE}}</div>
</header>

<nav class="toc" id="toc">
{{NAV_LINKS}}
</nav>

<div class="wrap">

<!-- ============ 学习路径 ============ -->
<div class="path-box">
  <h2>学习路径（由易到难）</h2>
  <p class="hint">按顺序勾选，进度会自动保存在浏览器里。每一步对应下方一个章节。</p>
  <div id="steps">
{{PATH_STEPS}}
  </div>
  <div class="progress-bar"><div id="pathBar"></div></div>
  <div class="progress-text" id="pathText">0 / 0</div>
</div>

{{SECTIONS}}

</div>

<footer>
{{FOOTER_NOTE}}
</footer>

<script>
/* ===== 学习路径进度（固定，勿改） ===== */
const STUDY_KEY='yoga{{CHAPTER_NUM}}-study-progress';
function loadProgress(){try{return JSON.parse(localStorage.getItem(STUDY_KEY))||{}}catch(e){return{}}}
function saveProgress(p){localStorage.setItem(STUDY_KEY,JSON.stringify(p))}
function renderPath(){
  const p=loadProgress();
  const steps=document.querySelectorAll('#steps input');
  let done=0;
  steps.forEach(cb=>{
    cb.checked=!!p[cb.dataset.step];
    cb.closest('.step-item').classList.toggle('completed',cb.checked);
    if(cb.checked)done++;
    const item=cb.closest('.step-item');
    const target=item.dataset.target;
    if(target){
      const link=document.querySelector('#toc a[href="'+target+'"]');
      if(link)link.classList.toggle('done',cb.checked);
    }
  });
  document.getElementById('pathBar').style.width=(steps.length?done/steps.length*100:0)+'%';
  document.getElementById('pathText').textContent=done+' / '+steps.length;
}
document.querySelectorAll('#steps input').forEach(cb=>{
  cb.addEventListener('change',()=>{
    const p=loadProgress();p[cb.dataset.step]=cb.checked;saveProgress(p);renderPath();
  });
});

/* ===== 流程推演组件（通用，勿改） ===== */
function initStepper(trackId,detailId,prevId,nextId,data){
  let idx=0;
  const track=document.getElementById(trackId),detail=document.getElementById(detailId);
  function render(){
    track.innerHTML=data.map((c,i)=>'<div class="flow-node '+(i===idx?'active':i<idx?'past':'')+'">'+c.t+'</div>').join('');
    track.querySelectorAll('.flow-node').forEach((n,i)=>n.onclick=()=>{idx=i;render();});
    detail.innerHTML=data[idx].d;
  }
  if(prevId)document.getElementById(prevId).onclick=()=>{idx=Math.max(0,idx-1);render();};
  if(nextId)document.getElementById(nextId).onclick=()=>{idx=Math.min(data.length-1,idx+1);render();};
  render();
}

/* ===== 归类练习组件（通用，勿改） ===== */
function initSorter(areaId,items){
  const area=document.getElementById(areaId);
  area.innerHTML=items.map((t,i)=>
    '<div class="tri-row"><div style="flex:1;min-width:200px;font-size:.95rem">'+t.a+'</div>'+
    '<div class="acts">'+t.opts.map(o=>'<button class="tri-btn" data-i="'+i+'" data-v="'+o+'">'+o+'</button>').join('')+'</div>'+
    '<div class="tri-exp" id="triExp'+i+'">✓ 正确答案：'+t.ans+' —— '+t.exp+'</div></div>'
  ).join('');
  area.querySelectorAll('.tri-btn').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i,v=b.dataset.v,t=items[i];
      b.closest('.tri-row').querySelectorAll('.tri-btn').forEach(x=>{
        x.classList.remove('correct','wrong');
        if(x.dataset.v===t.ans)x.classList.add('correct');
        else if(x===b)x.classList.add('wrong');
      });
      document.getElementById('triExp'+i).classList.add('show');
    };
  });
}

/* ===== 本章定制交互 ===== */
/* @@CUSTOM_JS@@ */

renderPath();
</script>
</body>
</html>
