<text x="178.0" y="1626.0" style="font-size:13px"><tspan style="fill:#6b6257">被杂染（烦恼）缠住，又怎么一步步解开。全卷五大块：先诊断——三世取识</tspan></text>
<text x="178.0" y="1646.0" style="font-size:13px"><tspan style="fill:#6b6257">、杂染根路与魔的着处；再讲观慧——从身观无我、识别戏论、以六处胜解给</tspan></text>
<text x="178.0" y="1666.0" style="font-size:13px"><tspan style="fill:#6b6257">五种修行人定级；接着把关修行——律仪三品、三种过患、七退缘、四着处四</tspan></text>
<text x="178.0" y="1686.0" style="font-size:13px"><tspan style="fill:#6b6257">邪行；然后说菩萨八相超越声闻；最后破「我」收尾，落在一向于空。</tspan></text>

<path class="edge" d="M1100.0,3177.0 H1114.0 M1114.0,3096.0 V3258.0 M1114.0,3096.0 H1130.0 M1114.0,3177.0 H1130.0 M1114.0,3258.0 H1130.0" fill="none" stroke="#d8cfbe" stroke-width="1.3"/>
<g class="badge" transform="translate(1116.0,3177.0)"><circle r="9" fill="#9a3b2e"/><text y="4" text-anchor="middle" fill="#fff" style="font-size:10px;font-weight:700">3</text></g>
<g class="node">
<rect class="hit" x="1126.0" y="3062.0" width="450.0" height="68.0" rx="6" fill="transparent"/>
<text x="1130.0" y="3077.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">四种寻求</tspan><tspan style="fill:#6b6257">：我用什么为自性、我是常还是无常、凭什么说常或无常、我住在何</tspan></text>
<text x="1130.0" y="3097.0" style="font-size:13px"><tspan style="fill:#6b6257">处——前三可依诸行如理施设且不颠倒；第四种「窟宅」（实我栖身之所）一</tspan></text>
<text x="1130.0" y="3117.0" style="font-size:13px"><tspan style="fill:#6b6257">切情形下终不可得</tspan></text>
</g>
<g class="node">
<rect class="hit" x="1126.0" y="3133.0" width="450.0" height="88.0" rx="6" fill="transparent"/>
<text x="1130.0" y="3148.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">我之自性只是假立</tspan><tspan style="fill:#6b6257">：十二处所生六识及受想思施设为「我」，过此更无余我，</tspan></text>
<text x="1130.0" y="3168.0" style="font-size:13px"><tspan style="fill:#6b6257">其体无常（有生老死故）；诸行如幻事（不成实）、如阳焰（颠倒迷乱）、有</tspan></text>
<text x="1130.0" y="3188.0" style="font-size:13px"><tspan style="fill:#6b6257">增减（起尽法）、名暂时（刹那性）、速疾相续（数数坏已频续）、本无今有</tspan></text>
<text x="1130.0" y="3208.0" style="font-size:13px"><tspan style="fill:#6b6257">已散灭（来无所从去无所至）——即生身展转与刹那展转两种无常</tspan></text>
</g>
<g class="node">
<rect class="hit" x="1126.0" y="3224.0" width="450.0" height="68.0" rx="6" fill="transparent"/>
<text x="1130.0" y="3239.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">窟宅终不可得</tspan><tspan style="fill:#6b6257">：诸行之外别有实我栖于诸行中，了不可得——世俗谛中诸行尚</tspan></text>
<text x="1130.0" y="3259.0" style="font-size:13px"><tspan style="fill:#6b6257">空不可施设，何况胜义，故「一向于空立空」；闻、思、修三重了知，次第生</tspan></text>
<text x="1130.0" y="3279.0" style="font-size:13px"><tspan style="fill:#6b6257">起应当欢喜、应当等喜、应当遍喜</tspan></text>
</g>

<script>
const svg=document.getElementById('mm'),vp=document.getElementById('vp');
let scale=1,tx=0,ty=0;
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fit(){const r=vp.getBBox(),W=innerWidth,H=innerHeight-42;
  scale=Math.min(W/(r.width+60),H/(r.height+60),1.3);
  tx=(W-r.width*scale)/2-r.x*scale;ty=42+(H-r.height*scale)/2-r.y*scale;apply()}
const clampS=s=>Math.min(6,Math.max(0.05,s));
function zoomAt(px,py,k){
  const ns=clampS(scale*k),kk=ns/scale;
  tx+=scale*px*(1-kk);ty+=scale*py*(1-kk);scale=ns;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();
  const unit=e.deltaMode===1?16:1;
  if(e.ctrlKey){
    const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
    zoomAt(pt.x,pt.y,Math.exp(-e.deltaY*unit*0.01));
  }else{
    tx-=e.deltaX*unit;ty-=e.deltaY*unit;apply();
  }},{passive:false});
let gscale=1;
svg.addEventListener('gesturestart',e=>{e.preventDefault();gscale=scale});
svg.addEventListener('gesturechange',e=>{e.preventDefault();
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
  zoomAt(pt.x,pt.y,e.scale*gscale/scale)});
svg.addEventListener('gestureend',e=>e.preventDefault());
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;
  drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging')});
addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()}});
addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});
document.getElementById('reset').addEventListener('click',fit);
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node');if(!g||g.classList.contains('root'))return;
  g.classList.toggle('collapsed');
  (function walk(node,ancHidden){
    [...node.children].filter(el=>el.classList&&el.classList.contains('node')).forEach(k=>{
      const hid=ancHidden||node.classList.contains('collapsed');
      k.style.display=hid?'none':'';walk(k,hid)});
  })(g,false);});
addEventListener('resize',fit);fit();
</script>
</body>
