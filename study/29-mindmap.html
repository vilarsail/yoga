<text x="178.0" y="1495.0" style="font-size:13px"><tspan style="fill:#6b6257">」开始发力修行。全卷沿一条渐修大道推进：先用四正断断恶修善，再修出四</tspan></text>
<text x="178.0" y="1515.0" style="font-size:13px"><tspan style="fill:#6b6257">种三摩地与八断行（合称四神足），长出五根五力，钻出暖、顶、忍、世第一</tspan></text>
<text x="178.0" y="1535.0" style="font-size:13px"><tspan style="fill:#6b6257">法的见道之火，踏上七觉支与八支圣道，抵达四沙门果；卷末附上识人与避坑</tspan></text>
<text x="178.0" y="1555.0" style="font-size:13px"><tspan style="fill:#6b6257">清单——谁修得快、四魔与种种魔事如何暗中作祟、精勤凭什么不落空。</tspan></text>

<text x="857.0" y="13.0" style="font-size:13px"><tspan style="fill:#6b6257">承接上文「已能了达善不善法」，本节回答如何实际断恶修善：先把对象定义</tspan></text>
<text x="857.0" y="33.0" style="font-size:13px"><tspan style="fill:#6b6257">清楚，再给出发力方法。</tspan></text>
</g>
<g class="node">

<text x="857.0" y="64.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">先分清对象</tspan><tspan style="fill:#6b6257">：恶不善法＝被欲界烦恼染污缠缚的身语意恶行，加上能引发它们</tspan></text>
<text x="857.0" y="84.0" style="font-size:13px"><tspan style="fill:#6b6257">的烦恼——现行叫「缠」，潜伏的种子叫「随眠」；未和合现前名未生，已现</tspan></text>
<text x="857.0" y="104.0" style="font-size:13px"><tspan style="fill:#6b6257">前名已生。善法即它们的对治：烦恼对治、五盖（贪欲等五种覆心的烦恼）对</tspan></text>
<text x="857.0" y="124.0" style="font-size:13px"><tspan style="fill:#6b6257">治、结（烦恼缠结）对治。</tspan></text>

<text x="857.0" y="240.5" style="font-size:13px"><tspan style="fill:#6b6257">生、已生恶令断灭、未生善令生、已生善令住不忘失并修至圆满。</tspan></text>

<g class="node">
<rect class="hit" x="1329.0" y="140.0" width="450.0" height="108.0" rx="6" fill="transparent"/>
<text x="1333.0" y="155.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">发力强度看两把尺</tspan><tspan style="fill:#6b6257">：按对境——缘过去未来等「不现见境」或唯由分别力（住</tspan></text>
<text x="1333.0" y="175.0" style="font-size:13px"><tspan style="fill:#6b6257">时思维）生起的，自策自励即可，名策励；缘当下「现见境」或兼境界力生起</tspan></text>
<text x="1333.0" y="195.0" style="font-size:13px"><tspan style="fill:#6b6257">的，须勇猛正勤，名发勤精进。按烦恼轻重——下中品缠用策励，上品缠须发</tspan></text>
<text x="1333.0" y="215.0" style="font-size:13px"><tspan style="fill:#6b6257">勤精进。对善法同理：策励为已得令住不忘，发勤精进为未得令得、令修圆满</tspan></text>
<text x="1333.0" y="235.0" style="font-size:13px"><tspan style="fill:#6b6257">。</tspan></text>
</g>
<g class="node">

<text x="1333.0" y="266.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">心的微调两招</tspan><tspan style="fill:#6b6257">：心下劣或恐下劣时，取一种净妙举相振奋庆悦其心，名策心；</tspan></text>
<text x="1333.0" y="286.0" style="font-size:13px"><tspan style="fill:#6b6257">心掉动或恐掉动时，略摄其心修止，名持心——在举与摄之间持续调音，才能</tspan></text>
<text x="1333.0" y="306.0" style="font-size:13px"><tspan style="fill:#6b6257">稳住一境。</tspan></text>

<text x="857.0" y="377.0" style="font-size:13px"><tspan style="fill:#6b6257">数习令现前）、防护断（对已生善远离放逸、令住不忘失）。</tspan></text>

<text x="857.0" y="428.0" style="font-size:13px"><tspan style="fill:#6b6257">只有两件正事——断灭应断的、获得应得的。</tspan></text>

<text x="935.0" y="712.0" style="font-size:13px"><tspan style="fill:#6b6257">、正知（观品之慧）、思（于断与未断正观察时造作其心、发起顺止观的身语</tspan></text>

<script>
const svg=document.getElementById('mm'),vp=document.getElementById('vp');
let scale=1,tx=0,ty=0;
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fit(){const r=vp.getBBox(),W=innerWidth,H=innerHeight-42;
  scale=Math.min(W/(r.width+60),H/(r.height+60),1.3);
  tx=(W-r.width*scale)/2-r.x*scale;ty=42+(H-r.height*scale)/2-r.y*scale;apply()}
const clampS=s=>Math.min(6,Math.max(0.05,s));
function zoomAt(px,py,k){
  const ns=clampS(scale*k),kk=ns/scale;
  tx+=scale*px*(1-kk);ty+=scale*py*(1-kk);scale=ns;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();
  const unit=e.deltaMode===1?16:1;
  if(e.ctrlKey){
    const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
    zoomAt(pt.x,pt.y,Math.exp(-e.deltaY*unit*0.01));
  }else{
    tx-=e.deltaX*unit;ty-=e.deltaY*unit;apply();
  }},{passive:false});
let gscale=1;
svg.addEventListener('gesturestart',e=>{e.preventDefault();gscale=scale});
svg.addEventListener('gesturechange',e=>{e.preventDefault();
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
  zoomAt(pt.x,pt.y,e.scale*gscale/scale)});
svg.addEventListener('gestureend',e=>e.preventDefault());
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;
  drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging')});
addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()}});
addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});
document.getElementById('reset').addEventListener('click',fit);
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node');if(!g||g.classList.contains('root'))return;
  g.classList.toggle('collapsed');
  (function walk(node,ancHidden){
    [...node.children].filter(el=>el.classList&&el.classList.contains('node')).forEach(k=>{
      const hid=ancHidden||node.classList.contains('collapsed');
      k.style.display=hid?'none':'';walk(k,hid)});
  })(g,false);});
addEventListener('resize',fit);fit();
</script>
