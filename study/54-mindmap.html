<text x="178.0" y="1727.0" style="font-size:13px"><tspan style="fill:#6b6257">什么染污、靠什么运转、粘在哪里、有几种状态，核心是四识住（识粘附于色</tspan></text>
<text x="178.0" y="1747.0" style="font-size:13px"><tspan style="fill:#6b6257">受想行的机制）与三解脱门的彻底离系；中段追问五蕴排序的五种理由，并清</tspan></text>
<text x="178.0" y="1767.0" style="font-size:13px"><tspan style="fill:#6b6257">点蕴界处根各份清单如何互相含摄；后半大篇幅思择色蕴，用极微、五种生、</tspan></text>
<text x="178.0" y="1787.0" style="font-size:13px"><tspan style="fill:#6b6257">刹那灭三把手术刀剖开物质世界，最后以根、所行境与作意三缘收尾，讲清一</tspan></text>
<text x="178.0" y="1807.0" style="font-size:13px"><tspan style="fill:#6b6257">次「看见」如何发生。</tspan></text>

<text x="896.0" y="84.0" style="font-size:13px"><tspan style="fill:#6b6257">都抓（俱安住），无色界识只抓内在的名（名安住）；越往上，攀缘对象越从</tspan></text>

<text x="896.0" y="206.0" style="font-size:13px"><tspan style="fill:#6b6257">同火样不同，所依一撤，识当场熄火。</tspan></text>

<text x="1138.0" y="277.0" style="font-size:13px"><tspan style="fill:#6b6257">在为下一期生命续期；有色界识有来有去、无色界识有死有生，两种住都到寿</tspan></text>
<text x="1138.0" y="297.0" style="font-size:13px"><tspan style="fill:#6b6257">量尽头为止，越此再施设只是文字差别（追问之下便无从作答）。</tspan></text>

<text x="1138.0" y="388.0" style="font-size:13px"><tspan style="fill:#6b6257">实」而回避涅槃），四系都在意地由分别生起。</tspan></text>

<text x="1138.0" y="439.0" style="font-size:13px"><tspan style="fill:#6b6257">二种随眠（潜伏的烦恼种子）→能缘的烦恼与所缘的境不再相续→有随眠识究</tspan></text>

<text x="1203.0" y="2480.0" style="font-size:13px"><tspan style="font-weight:700;fill:#3a3630">大种造色破题</tspan><tspan style="fill:#6b6257">：一切行既从自种子生，为何说大种造所造色？——大种变异则</tspan></text>
<text x="1203.0" y="2500.0" style="font-size:13px"><tspan style="fill:#6b6257">所造色随之变异，且大种建立它、任持它；变异有三条通道：士夫用（打击、</tspan></text>
<text x="1203.0" y="2520.0" style="font-size:13px"><tspan style="fill:#6b6257">器皿、水润火熟风燥）、业所作（随业力先大种生后色变异）、胜定（定力先</tspan></text>
<text x="1203.0" y="2540.0" style="font-size:13px"><tspan style="fill:#6b6257">起大种后造色生），另有五缘令异果转成异果——大种力、士夫力、明咒力、</tspan></text>
<text x="1203.0" y="2560.0" style="font-size:13px"><tspan style="fill:#6b6257">神通力、业力。</tspan></text>
</g>

<text x="1203.0" y="2611.0" style="font-size:13px"><tspan style="fill:#6b6257">如取所缘」等喻证成定有中有（此生已尽、来生未起之间的过渡状态）；生时</tspan></text>
<text x="1203.0" y="2631.0" style="font-size:13px"><tspan style="fill:#6b6257">大种先据处所、余造色依此而转，欲界身所起色界大种与下界色共住一处——</tspan></text>
<text x="1203.0" y="2651.0" style="font-size:13px"><tspan style="fill:#6b6257">如水处于沙中，并非各占一块地盘。</tspan></text>

<text x="1203.0" y="2742.0" style="font-size:13px"><tspan style="fill:#6b6257">）；定果色唯有显色（香等生因缺且无用）、唯依胜定不依大种。</tspan></text>

<text x="1164.0" y="2955.0" style="font-size:13px"><tspan style="fill:#6b6257">；色本无记，由加行、决定、等起三种软中上品思为依止才成善不善身语表业</tspan></text>
<text x="1164.0" y="2975.0" style="font-size:13px"><tspan style="fill:#6b6257">，而「运动」推求无实物可得——依止聚色的运动与聚色不异，于生灭四句皆</tspan></text>

<text x="1164.0" y="3046.0" style="font-size:13px"><tspan style="fill:#6b6257">后更无「停住因」可得——故一切诸行任运自灭，刹那义成；一切行是心果，</tspan></text>

<script>
const svg=document.getElementById('mm'),vp=document.getElementById('vp');
let scale=1,tx=0,ty=0;
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fit(){const r=vp.getBBox(),W=innerWidth,H=innerHeight-42;
  scale=Math.min(W/(r.width+60),H/(r.height+60),1.3);
  tx=(W-r.width*scale)/2-r.x*scale;ty=42+(H-r.height*scale)/2-r.y*scale;apply()}
const clampS=s=>Math.min(6,Math.max(0.05,s));
function zoomAt(px,py,k){
  const ns=clampS(scale*k),kk=ns/scale;
  tx+=scale*px*(1-kk);ty+=scale*py*(1-kk);scale=ns;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();
  const unit=e.deltaMode===1?16:1;
  if(e.ctrlKey){
    const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
    zoomAt(pt.x,pt.y,Math.exp(-e.deltaY*unit*0.01));
  }else{
    tx-=e.deltaX*unit;ty-=e.deltaY*unit;apply();
  }},{passive:false});
let gscale=1;
svg.addEventListener('gesturestart',e=>{e.preventDefault();gscale=scale});
svg.addEventListener('gesturechange',e=>{e.preventDefault();
  const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(vp.getScreenCTM().inverse());
  zoomAt(pt.x,pt.y,e.scale*gscale/scale)});
svg.addEventListener('gestureend',e=>e.preventDefault());
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;
  drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging')});
addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()}});
addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});
document.getElementById('reset').addEventListener('click',fit);
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node');if(!g||g.classList.contains('root'))return;
  g.classList.toggle('collapsed');
  (function walk(node,ancHidden){
    [...node.children].filter(el=>el.classList&&el.classList.contains('node')).forEach(k=>{
      const hid=ancHidden||node.classList.contains('collapsed');
      k.style.display=hid?'none':'';walk(k,hid)});
  })(g,false);});
addEventListener('resize',fit);fit();
</script>
